ai_usage_summary: |
  Used Gemini for design discussion, honeypot analysis, and logic verification.
  Used Cursor for refactoring and code organization.
  No candidate data was uploaded or sent to external network endpoints during ranking execution.

# ============================================================================
# Approach summary
# ============================================================================
methodology_summary: |
  Rule-based candidate ranking system with multi-stage filtering and hybrid scoring.
  First, 4 dynamic honeypot rules filter out logical/date inconsistencies (expert skills with 0 duration,
  YoE mismatch, impossible job/skill durations) and consulting-only career histories.
  Second, candidates are scored using a weighted hybrid score combining skill relevance (boosted if skills
  are mentioned in job descriptions to filter keyword stuffers), experience quality (YoE fit, product keywords,
  education tier), platform behavioral signals (response rate, recency, connections), and logistics (location,
  notice period). Outputs custom, non-templated reasoning for each shortlist candidate. Runs in < 2 minutes on CPU.

